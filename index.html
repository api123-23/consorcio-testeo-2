<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" id="theme-color" content="#F4F5F7" />
    <meta name="description" content="Sistema de gestión de consorcio" />
    <title>Concorcio — Sistema de Gestión</title>
    <script>try { const t = localStorage.getItem('theme'); if (t) { document.documentElement.setAttribute('data-theme', t); if (t === 'dark') document.getElementById('theme-color').setAttribute('content', '#111318'); } } catch(e) {} </script>
  </head>
  <body>
    <noscript>Necesitás JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
